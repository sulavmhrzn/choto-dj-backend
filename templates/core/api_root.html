<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ name }} — API</title>
<style>
  :root {
    --bg: #0b0d12;
    --surface: #12151c;
    --border: #232732;
    --text: #e6e8ec;
    --muted: #8b93a3;
    --accent: #6ee7b7;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f8fa;
      --surface: #ffffff;
      --border: #e4e7ec;
      --text: #14161a;
      --muted: #5b6472;
      --accent: #0f9d68;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 6vh 20px;
  }
  main {
    width: 100%;
    max-width: 640px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0;
    letter-spacing: -0.02em;
  }
  .badge {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--accent);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 10px;
    background: var(--surface);
  }
  .sub {
    color: var(--muted);
    font-size: 0.9rem;
    margin: 0 0 32px;
  }
  .sub span { color: var(--accent); font-weight: 600; }
  ul.endpoints {
    list-style: none;
    margin: 0;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface);
  }
  ul.endpoints li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  ul.endpoints li:last-child { border-bottom: none; }
  .label {
    font-weight: 600;
    font-size: 0.9rem;
    text-transform: capitalize;
  }
  .url {
    font-family: var(--mono);
    font-size: 0.82rem;
    color: var(--muted);
    text-decoration: none;
    overflow-wrap: anywhere;
    text-align: right;
  }
  .url:hover { color: var(--accent); }
  footer {
    margin-top: 28px;
    color: var(--muted);
    font-size: 0.78rem;
    text-align: center;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>{{ name }}</h1>
    <span class="badge">{{ status }}</span>
  </header>
  <p class="sub">version <span>{{ version }}</span></p>

  <ul class="endpoints">
    {% for label, url in endpoints.items %}
    <li>
      <span class="label">{{ label }}</span>
      <a class="url" href="{{ url }}">{{ url }}</a>
    </li>
    {% endfor %}
  </ul>

  <footer>JSON available at this URL via <code>Accept: application/json</code></footer>
</main>
</body>
</html>
