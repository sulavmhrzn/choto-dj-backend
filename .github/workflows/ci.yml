name: CI

on:
    push:
    pull_request:

jobs:
    test:
        name: Django tests
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_DB: choto_test
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d choto_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 5

            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 5

        env:
            DJANGO_SETTINGS_MODULE: config.settings
            SECRET_KEY: ci-only-secret-key
            DEBUG: "False"
            CSRF_TRUSTED_ORIGINS: http://localhost,https://choto-api.sulavm.com.np

            POSTGRES_DB: choto_test
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_HOST: localhost
            POSTGRES_PORT: "5432"

            CELERY_BROKER_URL: redis://localhost:6379/0
            REDIS_CACHE_URL: redis://localhost:6379/1
            WEBHOOK_ENCRYPTION_KEY: "hivGfCCZ84t4tfUp0oyYgo1FqH3568ac43fZuM-BO-8="

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Install uv
              uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
              with:
                  enable-cache: true

            - name: Install Python
              run: uv python install

            - name: Install dependencies
              run: uv sync --frozen

            - name: Check Django configuration
              run: uv run manage.py check

            - name: Check for missing migrations
              run: uv run manage.py makemigrations --check --dry-run

            - name: Apply migrations
              run: uv run manage.py migrate --noinput

            - name: Run tests
              run: uv run pytest

    build-and-push:
        name: Build and push Docker image
        runs-on: ubuntu-latest
        needs: test
        permissions:
            contents: read
            packages: write

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Login in to Github container Registry
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{github.actor}}
                password: ${{secrets.GITHUB_TOKEN}}
            
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                context: .
                target: production
                push: ${{github.event_name == 'push' && github.ref == 'refs/heads/main'}}
                tags: |
                  ghcr.io/${{github.repository}}:latest
                  ghcr.io/${{github.repository}}:${{github.sha}}
                cache-from: type=gha
                cache-to: type=gha,mode=max