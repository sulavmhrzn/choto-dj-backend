services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-choto}
      POSTGRES_USER: ${POSTGRES_USER:-choto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-choto}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-choto} -d ${POSTGRES_DB:-choto}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  migrate:
    build:
      context: .
      target: development

    command: python manage.py migrate --noinput

    env_file:
      - .env

    volumes:
      - .:/app

    depends_on:
      db:
        condition: service_healthy

    restart: "no"

  api:
    build:
      context: .
      target: development

    command: python manage.py runserver 0.0.0.0:8000

    env_file:
      - .env

    ports:
      - "${API_PORT:-8000}:8000"

    volumes:
      - .:/app

    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    restart: unless-stopped

volumes:
  postgres_data: